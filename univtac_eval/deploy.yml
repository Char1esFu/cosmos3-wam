# Basic experiment configuration (keep unchanged across policies)
policy_name: cosmos3
seed: 0
ckpt_setting: 50
instruction_type: seen
instuction_file: null

# ----- Cosmos3-specific deploy parameters -----
# Checkpoint: {cosmos3_ckpt_root}/{task}_{TRAIN_CONFIG} (lerobot pretrained_model dir), TRAIN_CONFIG e.g.
# tac-trainable. Results go to eval_result/cosmos3/{task}/deploy/{TRAIN_CONFIG}-rtc{n}/ (-replan{n} without RTC).
cosmos3_ckpt_root: ~/proj/cosmos3-wam/ckpt
# Python of the venv with the cosmos3-wam repo installed, which runs cosmos3_server.py.
cosmos3_python: ~/proj/cosmos3-wam/.venv/bin/python
# Execute the first n actions of each 50-action chunk, then sample the next chunk (receding horizon; the
# env var COSMOS3_REPLAN_EVERY overrides).
cosmos3_replan_every: 10
# Real-Time Chunking (synchronous, inference delay 0): guide each chunk's action sampling towards the unexecuted
# rest of the previous chunk (rtc_config of the Cosmos3 policy). COSMOS3_RTC=1/0 overrides;
# results then go to deploy/{TRAIN_CONFIG}-rtc{n}/.
cosmos3_rtc: true
cosmos3_rtc_max_guidance_weight: 10.0
cosmos3_rtc_schedule: LINEAR
# Weights in bfloat16 (as the Cosmos3-Edge base); null keeps the checkpoint config's sampling steps (30).
cosmos3_dtype: bfloat16
cosmos3_num_inference_steps: null
# 0: start a local server subprocess on a free port.
cosmos3_port: 0
